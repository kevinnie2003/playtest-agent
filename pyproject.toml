[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playtest-agent"
version = "0.1.0"
description = "Autonomous playtesting agent: plays a game, hunts for bugs, writes a reproducible report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
playtest = "playtest_agent.cli:main"
playtest-mcp = "playtest_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
